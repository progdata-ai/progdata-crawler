[project]
name = "progdata-crawler"
version = "0.1.0"
description = "Fetch, crawl, search and structure web content for LLMs and agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.28.1",
    "mcp>=2.3.0",
    "playwright>=1.65.2",
    "protego>=0.7.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "selectolax>=1.0.2",
    "trafilatura>=2.3.1",
    "typer>=0.29.1",
]

[project.scripts]
progdata-crawler = "progdata_crawler.api.cli:app"
pdc = "progdata_crawler.api.cli:app"

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-asyncio>=1.5.0",
    "ruff",
]
licenses = [
    "pip-licenses>=5.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/progdata_crawler"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
