name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(uv run --no-sync python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The runner image already has the system libraries Chromium needs, so the slow
      # `--with-deps` apt step is skipped. The browser itself comes from the cache.
      - name: Install Chromium for browser tests
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: uv run --no-sync playwright install chromium
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Type check
        run: uv run --no-sync pyright
      - name: Test
        run: uv run --no-sync pytest

  licenses:
    name: License check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # Only runtime dependencies are checked. Dev tools are not shipped with the package.
      - name: Install runtime dependencies
        run: uv sync --locked --no-dev --group licenses
      # Allowed: MIT, BSD, Apache, ISC, PSF and MPL-2.0. MPL-2.0 packages are used unmodified.
      - name: Allow only permissive licenses
        run: >-
          uv run --no-sync pip-licenses
          --from=mixed
          --ignore-packages progdata-crawler
          --partial-match
          --allow-only="MIT;BSD;Apache;ISC;Python Software Foundation;PSF-2.0;Mozilla Public License 2.0;MPL-2.0"
