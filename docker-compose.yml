# Services that run next to progdata-crawler. Start them with `docker compose up -d`.
#
# SearXNG is an optional search provider for local use
# (PDC_SEARCH_PROVIDER=searxng, PDC_SEARXNG_URL=http://127.0.0.1:8888).
# The default provider is the Brave Search API, which needs no service here.

services:
  searxng:
    # searxng/searxng 2026.11.5-adbf160ff, pinned by digest.
    image: searxng/searxng@sha256:124830d6d9d048f1e87741e47365e9a224f57af3be2de4c9059ab86964338169
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET to a long random value}
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
      # Listen on IPv4 inside the container; the default (::) fails on hosts without IPv6.
      GRANIAN_HOST: 0.0.0.0
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
